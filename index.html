<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Highlights</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Call Highlights</h1>
        
        <div class="input-section">
            <textarea 
                id="transcriptInput" 
                placeholder="Paste your Notion call transcript here..."
                rows="10"
            ></textarea>
            <button id="displayBtn">Display</button>
        </div>
        
        <div class="display-section">
            <div id="transcriptDisplay"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
