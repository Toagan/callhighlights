<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Crypto Arbitrage Analyzer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Polymarket Crypto Arbitrage Analyzer</h1>
            <div class="header-controls">
                <button id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
                <span class="last-update" id="lastUpdate">Never updated</span>
            </div>
        </header>

        <!-- Crypto Prices Section -->
        <section class="prices-section">
            <h2>Current Crypto Prices (Top 5 Markets)</h2>
            <div class="prices-grid" id="pricesGrid">
                <div class="price-card loading">
                    <div class="spinner"></div>
                    <p>Loading prices...</p>
                </div>
            </div>
        </section>

        <!-- Filters Section -->
        <section class="filters-section">
            <h2>Filters</h2>
            <div class="filters">
                <div class="filter-group">
                    <label for="minProfit">Min Profit %:</label>
                    <input type="number" id="minProfit" value="5" min="0" step="0.1">
                </div>
                <div class="filter-group">
                    <label for="minLiquidity">Min Liquidity:</label>
                    <input type="number" id="minLiquidity" value="1000" min="0" step="100">
                </div>
                <div class="filter-group">
                    <label for="sortBy">Sort By:</label>
                    <select id="sortBy">
                        <option value="profit">Profit %</option>
                        <option value="liquidity">Liquidity</option>
                        <option value="mispricing">Mispricing %</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Arbitrage Opportunities Section -->
        <section class="opportunities-section">
            <h2>Arbitrage Opportunities</h2>
            <div class="opportunities-header">
                <span id="opportunityCount">0 opportunities found</span>
            </div>
            <div class="table-container">
                <table id="opportunitiesTable">
                    <thead>
                        <tr>
                            <th>Market</th>
                            <th>Current Price</th>
                            <th>Polymarket Yes</th>
                            <th>Implied Price</th>
                            <th>Mispricing %</th>
                            <th>Potential Profit %</th>
                            <th>Liquidity</th>
                            <th>Risk</th>
                        </tr>
                    </thead>
                    <tbody id="opportunitiesBody">
                        <tr>
                            <td colspan="8" class="loading-row">
                                <div class="spinner"></div>
                                <p>Scanning for opportunities...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
